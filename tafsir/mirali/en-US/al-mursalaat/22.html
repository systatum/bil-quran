 class="sc-giIpqw fLbTQM coneto-button"><a class="sc-ezrbvT bDHAli" aria-label=prev-verse-btn data-testid=prev-verse-btn href=/tafsir/mirali/en-US/al-mursalaat/21.html><span class="sc-lmoNFi kKeziY" aria-label=button-label><img alt class=remixicon height=24 src=/assets/svg/58d9fcd65b583641.svg style=display:block;vertical-align:middle; width=24></span></a></div><div class="sc-giIpqw fLbTQM coneto-button"><button class="sc-ezrbvT bDHAli" aria-label=verse-bookmarker-btn><span class="sc-lmoNFi kKeziY" aria-label=button-label><img alt class=remixicon height=18 src=/assets/svg/2d42f1fcbc7af0f9.svg style=display:block;vertical-align:middle; width=18></span></button></div></div></div></div></div></div></div></div><script>(function(){
var DATA={"siteUrl":"https://bil-quran.com","chapterId":77,"verseNumber":22,"exegesisId":"mirali","locale":"en-US"};
var TRIGGER_SELECTORS=["[aria-label=\"overlay-blocker\"]",".exegesis-source-label",".app-header","[aria-label=\"verse-bookmarker-btn\"]","[aria-label=\"paper-dialog-drag-indicator\"]","[aria-label=\"split-pane-divider\"]"];

function realAppUrl(verse){
  var params=new URLSearchParams({tafsir:DATA.exegesisId,transliteration:"1",locale:DATA.locale});
  return DATA.siteUrl+"/#/e/"+DATA.chapterId+"/"+verse+"?"+params.toString();
}

function redirectNow(verse){
  window.location.href=realAppUrl(verse);
}

function wireStaticTriggers(root){
  TRIGGER_SELECTORS.forEach(function(sel){
    root.querySelectorAll(sel).forEach(function(el){
      el.addEventListener("click",function(){redirectNow(DATA.verseNumber)});
    });
  });
}

function wireTraversal(root){
  root.querySelectorAll('a[data-testid="prev-verse-btn"],a[data-testid="next-verse-btn"]').forEach(function(link){
    link.addEventListener("click",function(e){
      e.preventDefault();
      var href=link.getAttribute("href");
      var delta=link.getAttribute("data-testid")==="prev-verse-btn"?-1:1;
      var targetVerse=DATA.verseNumber+delta;

      fetch(href).then(function(res){return res.text()}).then(function(html){
        var doc=new DOMParser().parseFromString(html,"text/html");
        var newContent=doc.querySelector('[aria-label="paper-dialog-content"]');
        var oldContent=document.querySelector('[aria-label="paper-dialog-content"]');
        if(!newContent||!oldContent)return;

        oldContent.replaceWith(newContent);
        document.title=doc.title;
        history.pushState(null,"",href);
        DATA.verseNumber=targetVerse;

        wireStaticTriggers(newContent);
        wireTraversal(newContent);
      }).catch(function(){});
    });
  });
}

wireStaticTriggers(document);
wireTraversal(document);
})();</script><!--ssg-hash:d146fd18a4703de8-->
